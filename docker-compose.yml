services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    security_opt:
      - no-new-privileges:true
    command: >
      sh -c "php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: php artisan queue:work database --tries=5 --timeout=120 --sleep=3
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tawsela}
      MYSQL_USER: ${DB_USERNAME:-tawsela}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tawsela}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

    ports:
      - "3307:3306"


  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - app-network

    
    
volumes:
  mysql_data:
  vendor:
  storage_data:

networks:
  app-network:
    driver: bridge
